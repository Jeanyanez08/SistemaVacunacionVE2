<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador Clínico · Centro de Salud</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <style>
    .gov-cam-accent {
      border-top: 3px solid var(--turquesa-ciber);
    }

    /* Botones unificados al estilo sólido de "Actualizar" */
    .btn-estilo-actualizar {
      background: linear-gradient(135deg, var(--turquesa), #126572) !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      border-radius: 10px !important;
      padding: 0.48rem 1rem !important;
      border: none !important;
      box-shadow: 0 4px 12px rgba(22, 125, 141, 0.28) !important;
      transition: all 0.2s ease !important;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-estilo-actualizar:hover {
      transform: translateY(-1px);
      box-shadow: var(--sombra-glow) !important;
      color: #ffffff !important;
    }

    .btn-estilo-actualizar.sm {
      padding: 0.32rem 0.75rem !important;
      font-size: 0.82rem !important;
    }
  </style>
</head>
<body class="gov-cam-accent">
  <nav class="navbar navbar-dark navbar-institucional">
    <div class="container">
      <span class="brand-text">BUSCADOR CLÍNICO DE PACIENTES</span>
      <div class="d-flex flex-wrap gap-2">
        <a href="registro_vacunas.html" class="btn-estilo-actualizar">
          <i class="fa-solid fa-hospital-user me-1"></i>Registro Operativo
        </a>
        <a href="../../index.html" class="btn-estilo-actualizar">
          <i class="fa-solid fa-house me-1"></i>Portal Principal
        </a>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="card card-futurista p-4 p-md-5">
      <h4 class="fw-bold text-azul mb-4">
        <i class="fa-solid fa-magnifying-glass text-info me-2"></i>Consulta Rápida de Historial Clínico
      </h4>

      <form id="formBuscarPaciente" class="row g-3 mb-4">
        <div class="col-md-9">
          <input
            id="inputCedulaBuscador"
            type="text"
            class="form-control form-control-lg"
            placeholder="Ingrese número de cédula del paciente (ej. 32456663 o V-28123456)..."
            required
          >
        </div>
        <div class="col-md-3">
          <button class="btn-estilo-actualizar w-100 py-3" type="submit">
            <i class="fa-solid fa-search me-2"></i>Buscar
          </button>
        </div>
      </form>

      <div id="mensajeBuscador" class="alert alert-info d-none mb-4"></div>

      <div class="table-responsive">
        <table class="table table-custom align-middle mb-0">
          <thead>
            <tr>
              <th>Cédula</th>
              <th>Ciudadano</th>
              <th>Correo</th>
              <th>Última Dosis</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpoResultados">
            <tr>
              <td><strong>V-28.123.456</strong></td>
              <td>Paola Camaripano</td>
              <td>correo@ejemplo.com</td>
              <td>Pentavalente</td>
              <td>
                <button type="button" class="btn-estilo-actualizar sm" onclick="verFichaDemo()">
                  <i class="fa-solid fa-folder-open me-1"></i>Ver Ficha
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>República Bolivariana de Venezuela · Sistema Nacional de Vacunación © 2026</footer>

  <script>
    const API_URL = 'http://localhost:5000/api';
    const cuerpoResultados = document.getElementById('cuerpoResultados');
    const mensajeBuscador = document.getElementById('mensajeBuscador');

    window.verFichaDemo = function() {
      mensajeBuscador.className = 'alert alert-info mb-4';
      mensajeBuscador.textContent = 'Ficha clínica de referencia: V-28.123.456 · Paola Camaripano · Última dosis registrada: Pentavalente.';
    };

    document.getElementById('formBuscarPaciente').addEventListener('submit', async (e) => {
      e.preventDefault();
      const cedula = document.getElementById('inputCedulaBuscador').value.trim();
      mensajeBuscador.classList.add('d-none');

      try {
        const res = await fetch(`${API_URL}/pacientes/${encodeURIComponent(cedula)}`);
        const data = await res.json();

        if (!res.ok || !data.ok || !data.paciente) {
          mensajeBuscador.className = 'alert alert-warning mb-4';
          mensajeBuscador.textContent = data.mensaje || 'No se encontraron registros para la cédula consultada.';
          return;
        }

        const p = data.paciente;
        const dosisLista = Array.isArray(data.vacunas) ? data.vacunas : [];
        const ultima = dosisLista[0];
        const textoUltima = ultima
          ? `${ultima.nombre_vacuna || `Vacuna #${ultima.id_vacunas}`} (Dosis #${ultima.nro_dosis})`
          : 'Sin dosis aplicadas';

        cuerpoResultados.innerHTML = `
          <tr>
            <td><strong>${p.cedula}</strong></td>
            <td>${p.nombres} ${p.apellidos}</td>
            <td>${p.correo || '-'}</td>
            <td>${textoUltima}</td>
            <td>
              <a href="registro_vacunas.html" class="btn-estilo-actualizar sm">
                <i class="fa-solid fa-notes-medical me-1"></i>Gestionar
              </a>
            </td>
          </tr>
        `;
      } catch {
        mensajeBuscador.className = 'alert alert-warning mb-4';
        mensajeBuscador.textContent = 'No se pudo consultar http://localhost:5000/api. Verifique que el servidor backend esté activo.';
      }
    });
  </script>
</body>
</html>
