<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Salud · Registro Operativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <style>
    .gov-cam-accent {
      border-top: 3px solid var(--turquesa-ciber);
    }

    /* Botones unificados al estilo sólido de "Actualizar" */
    .btn-estilo-actualizar {
      background: linear-gradient(135deg, var(--turquesa), #126572) !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      border-radius: 10px !important;
      padding: 0.48rem 1rem !important;
      border: none !important;
      box-shadow: 0 4px 12px rgba(22, 125, 141, 0.28) !important;
      transition: all 0.2s ease !important;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-estilo-actualizar:hover {
      transform: translateY(-1px);
      box-shadow: var(--sombra-glow) !important;
      color: #ffffff !important;
    }

    .btn-estilo-actualizar.activo {
      background: linear-gradient(135deg, var(--azul-gob), var(--turquesa)) !important;
      outline: 2px solid var(--turquesa-ciber);
    }

    .btn-estilo-actualizar.sm {
      padding: 0.32rem 0.75rem !important;
      font-size: 0.82rem !important;
    }

    .gov-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 25, 47, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1050;
    }

    .gov-modal-card {
      background: var(--gris-tarjeta);
      border: 2px solid var(--turquesa);
      border-radius: 20px;
      width: 100%;
      max-width: 640px;
      padding: 1.75rem;
      box-shadow: var(--sombra-hover);
    }
  </style>
</head>
<body class="gov-cam-accent">
  <nav class="navbar navbar-expand-lg navbar-dark navbar-institucional sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="registro_vacunas.html">
        <i class="fa-solid fa-hospital-user fa-2x me-3 text-info"></i>
        <div>
          <span class="brand-text">CENTRO DE SALUD OPERATIVO</span>
          <small class="brand-subtext">Perfil 2 · Registro Diario de Inmunización y Exámenes</small>
        </div>
      </a>
      <div class="d-flex flex-wrap gap-2 ms-auto mt-2 mt-lg-0">
        <a href="buscar_personas.html" class="btn-estilo-actualizar">
          <i class="fa-solid fa-search me-1"></i>Buscador
        </a>
        <a href="../../login.html" class="btn-estilo-actualizar">
          <i class="fa-solid fa-power-off me-1"></i>Salir
        </a>
      </div>
    </div>
  </nav>

  <main class="container my-5" id="root-centro"></main>

  <footer>República Bolivariana de Venezuela · Sistema Nacional de Vacunación © 2026</footer>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_URL = 'http://localhost:5000/api';

    function CentroApp() {
      const [tab, setTab] = useState('persona');
      const [msg, setMsg] = useState('');
      const [err, setErr] = useState('');

      const [personas, setPersonas] = useState([]);
      const [vacunas, setVacunas] = useState([]);
      const [examenes, setExamenes] = useState([]);

      // 1. Registrar Persona
      const [cedulaPersona, setCedulaPersona] = useState('');
      const [nombres, setNombres] = useState('');
      const [apellidos, setApellidos] = useState('');
      const [fechaNacimiento, setFechaNacimiento] = useState('');
      const [correo, setCorreo] = useState('');
      const [telefono, setTelefono] = useState('');
      const [ubicacion, setUbicacion] = useState('San Juan de los Morros');
      const [editPersona, setEditPersona] = useState(null);

      // 2. Cargar Vacuna
      const [cedulaVacuna, setCedulaVacuna] = useState('');
      const [vacuna, setVacuna] = useState('BCG');
      const [lote, setLote] = useState('');
      const [nroDosis, setNroDosis] = useState(1);
      const [fechaAplicacion, setFechaAplicacion] = useState(new Date().toISOString().slice(0, 10));
      const [centroSalud, setCentroSalud] = useState('1');
      const [editVacuna, setEditVacuna] = useState(null);

      // 3. Exámenes Externos para Informe
      const [cedulaExamen, setCedulaExamen] = useState('');
      const [tipoExamen, setTipoExamen] = useState('Serología de Anticuerpos');
      const [archivoNombre, setArchivoNombre] = useState('');
      const [rutaArchivo, setRutaArchivo] = useState('');
      const [observacion, setObservacion] = useState('');
      const [editExamen, setEditExamen] = useState(null);

      const limpiarMensajes = () => {
        setMsg('');
        setErr('');
      };

      const cargarRegistros = async () => {
        try {
          const [rPer, rVac, rExa] = await Promise.all([
            fetch(`${API_URL}/pacientes`),
            fetch(`${API_URL}/vacunas`),
            fetch(`${API_URL}/examenes`)
          ]);
          const [dPer, dVac, dExa] = await Promise.all([
            rPer.json(),
            rVac.json(),
            rExa.json()
          ]);
          if (dPer.ok) setPersonas(dPer.data || []);
          if (dVac.ok) setVacunas(dVac.data || []);
          if (dExa.ok) setExamenes(dExa.data || []);
        } catch {
          // Si el backend no está activo, se mantiene el formulario operativo
        }
      };

      useEffect(() => {
        cargarRegistros();
      }, [tab]);

      // --- PERSONAS ---
      const handleRegistrarPersona = async (e) => {
        e.preventDefault();
        limpiarMensajes();
        try {
          const res = await fetch(`${API_URL}/pacientes/registrar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              cedula: cedulaPersona.trim(),
              nombres: nombres.trim(),
              apellidos: apellidos.trim(),
              fecha_nacimiento: fechaNacimiento,
              correo: correo.trim(),
              telefono: telefono.trim(),
              ubicacion: ubicacion.trim()
            })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            setErr(data.mensaje || 'No se pudo registrar el ciudadano.');
            return;
          }
          setMsg(data.mensaje || 'Ciudadano registrado con éxito en el sistema');
          setCedulaPersona('');
          setNombres('');
          setApellidos('');
          setFechaNacimiento('');
          setCorreo('');
          setTelefono('');
          cargarRegistros();
        } catch {
          setErr('No se pudo conectar con el servidor en http://localhost:5000.');
        }
      };

      const handleGuardarEditPersona = async (e) => {
        e.preventDefault();
        if (!editPersona) return;
        limpiarMensajes();
        try {
          const res = await fetch(`${API_URL}/pacientes/${editPersona.id_personas}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(editPersona)
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            setErr(data.mensaje || 'No se pudo actualizar el ciudadano.');
            return;
          }
          setMsg(data.mensaje || 'Ciudadano actualizado correctamente');
          setEditPersona(null);
          cargarRegistros();
        } catch {
          setErr('Error de conexión al actualizar ciudadano.');
        }
      };

      const handleEliminarPersona = async (idPersonas) => {
        limpiarMensajes();
        try {
          const res = await fetch(`${API_URL}/pacientes/${idPersonas}`, { method: 'DELETE' });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            setErr(data.mensaje || 'No se pudo eliminar el ciudadano.');
            return;
          }
          setMsg(data.mensaje || 'Ciudadano eliminado');
          cargarRegistros();
        } catch {
          setErr('Error de conexión al eliminar ciudadano.');
        }
      };

      // --- VACUNAS ---
      const handleRegistrarVacuna = async (e) => {
        e.preventDefault();
        limpiarMensajes();
        try {
          const res = await fetch(`${API_URL}/vacunas/registrar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              cedula: cedulaVacuna.trim(),
              vacuna,
              lote: lote.trim(),
              nro_dosis: Number(nroDosis) || 1,
              fecha_aplicacion: fechaAplicacion,
              centro_salud: centroSalud.trim()
            })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            setErr(data.mensaje || 'No se pudo registrar la vacuna.');
            return;
          }
          setMsg(data.mensaje || 'Dosis de vacuna registrada y enlazada al paciente');
          setCedulaVacuna('');
          setLote('');
          setNroDosis(1);
          cargarRegistros();
        } catch {
          setErr('No se pudo conectar con el servidor en http://localhost:5000.');
        }
      };

      const handleGuardarEditVacuna = async (e) => {
        e.preventDefault();
        if (!editVacuna) return;
        limpiarMensajes();
        try {
          const res = await fetch(`${API_URL}/vacunas/${editVacuna.id_registro}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              vacuna: editVacuna.nombre_vacuna || editVacuna.id_vacunas,
              lote: editVacuna.numero_lote || editVacuna.id_lote,
              centro_salud: editVacuna.id_centros || 1,
              nro_dosis: Number(editVacuna.nro_dosis) || 1
            })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            setErr(data.mensaje || 'No se pudo actualizar la dosis.');
            return;
          }
          setMsg(data.mensaje || 'Dosis actualizada correctamente');
          setEditVacuna(null);
          cargarRegistros();
        } catch {
          setErr('Error de conexión al actualizar dosis.');
        }
      };

      const handleEliminarVacuna = async (idRegistro) => {
        limpiarMensajes();
        try {
          const res = await fetch(`${API_URL}/vacunas/${idRegistro}`, { method: 'DELETE' });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            setErr(data.mensaje || 'No se pudo eliminar la dosis.');
            return;
          }
          setMsg(data.mensaje || 'Dosis eliminada');
          cargarRegistros();
        } catch {
          setErr('Error de conexión al eliminar dosis.');
        }
      };

      // --- EXÁMENES ---
      const handleAnexarExamen = async (e) => {
        e.preventDefault();
        limpiarMensajes();
        const nombreFinal = archivoNombre || 'documento_adjunto.pdf';
        const rutaFinal = rutaArchivo.trim() || `/uploads/${nombreFinal}`;
        try {
          const res = await fetch(`${API_URL}/examenes/anexar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              cedula: cedulaExamen.trim(),
              tipo_examen: tipoExamen,
              nombre_archivo: nombreFinal,
              ruta_archivo: rutaFinal,
              archivo_url: rutaFinal,
              observacion: observacion.trim() || `Documento adjunto: ${nombreFinal}`
            })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            setErr(data.mensaje || 'No se pudo anexar el examen.');
            return;
          }
          setMsg(data.mensaje || 'Examen externo anexado para revisión y validación de la Subregión');
          setCedulaExamen('');
          setArchivoNombre('');
          setRutaArchivo('');
          setObservacion('');
          cargarRegistros();
        } catch {
          setErr('No se pudo conectar con el servidor en http://localhost:5000.');
        }
      };

      const handleGuardarEditExamen = async (e) => {
        e.preventDefault();
        if (!editExamen) return;
        limpiarMensajes();
        try {
          const res = await fetch(`${API_URL}/examenes/dictamen/${editExamen.id_examenes}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nombre_archivo: editExamen.nombre_archivo,
              ruta_archivo: editExamen.ruta_archivo
            })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            setErr(data.mensaje || 'No se pudo actualizar el examen.');
            return;
          }
          setMsg(data.mensaje || 'Examen actualizado correctamente');
          setEditExamen(null);
          cargarRegistros();
        } catch {
          setErr('Error de conexión al actualizar examen.');
        }
      };

      const handleEliminarExamen = async (idExamen) => {
        limpiarMensajes();
        try {
          const res = await fetch(`${API_URL}/examenes/${idExamen}`, { method: 'DELETE' });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            setErr(data.mensaje || 'No se pudo eliminar el examen.');
            return;
          }
          setMsg(data.mensaje || 'Examen eliminado');
          cargarRegistros();
        } catch {
          setErr('Error de conexión al eliminar examen.');
        }
      };

      return (
        <div>
          {msg && <div className="alert alert-success mb-4"><i className="fa-solid fa-circle-check me-2"></i>{msg}</div>}
          {err && <div className="alert alert-danger mb-4"><i className="fa-solid fa-triangle-exclamation me-2"></i>{err}</div>}

          <div className="d-flex flex-wrap gap-2 mb-4">
            <button
              type="button"
              className={`btn-estilo-actualizar ${tab === 'persona' ? 'activo' : ''}`}
              onClick={() => { limpiarMensajes(); setTab('persona'); }}
            >
              <i className="fa-solid fa-user-plus me-2"></i>1. Registrar Persona
            </button>
            <button
              type="button"
              className={`btn-estilo-actualizar ${tab === 'vacuna' ? 'activo' : ''}`}
              onClick={() => { limpiarMensajes(); setTab('vacuna'); }}
            >
              <i className="fa-solid fa-syringe me-2"></i>2. Cargar Vacuna
            </button>
            <button
              type="button"
              className={`btn-estilo-actualizar ${tab === 'examenes' ? 'activo' : ''}`}
              onClick={() => { limpiarMensajes(); setTab('examenes'); }}
            >
              <i className="fa-solid fa-file-medical me-2"></i>3. Exámenes Externos para Informe
            </button>
          </div>

          {tab === 'persona' && (
            <div className="card card-futurista p-4 p-md-5">
              <h4 className="fw-bold text-azul mb-4"><i className="fa-solid fa-id-card me-2 text-info"></i>Datos Básicos del Ciudadano</h4>
              <form onSubmit={handleRegistrarPersona} className="mb-5">
                <div className="row g-3">
                  <div className="col-md-4"><label className="form-label">Cédula</label><input type="text" className="form-control" placeholder="V-28123456" value={cedulaPersona} onChange={(e) => setCedulaPersona(e.target.value)} required /></div>
                  <div className="col-md-4"><label className="form-label">Nombres</label><input type="text" className="form-control" value={nombres} onChange={(e) => setNombres(e.target.value)} required /></div>
                  <div className="col-md-4"><label className="form-label">Apellidos</label><input type="text" className="form-control" value={apellidos} onChange={(e) => setApellidos(e.target.value)} required /></div>
                  <div className="col-md-4"><label className="form-label">Fecha Nacimiento</label><input type="date" className="form-control" value={fechaNacimiento} onChange={(e) => setFechaNacimiento(e.target.value)} required /></div>
                  <div className="col-md-4"><label className="form-label">Correo Electrónico</label><input type="email" className="form-control" value={correo} onChange={(e) => setCorreo(e.target.value)} required /></div>
                  <div className="col-md-4"><label className="form-label">Teléfono</label><input type="tel" className="form-control" value={telefono} onChange={(e) => setTelefono(e.target.value)} required /></div>
                  <div className="col-md-12"><label className="form-label">Ubicación</label><input type="text" className="form-control" value={ubicacion} onChange={(e) => setUbicacion(e.target.value)} /></div>
                  <div className="col-12 mt-3"><button type="submit" className="btn-estilo-actualizar">Guardar Ciudadano</button></div>
                </div>
              </form>

              <div className="table-responsive">
                <table className="table table-custom align-middle mb-0">
                  <thead>
                    <tr><th>ID</th><th>Cédula</th><th>Nombre Completo</th><th>Correo</th><th>Teléfono</th><th>Acciones</th></tr>
                  </thead>
                  <tbody>
                    {personas.length === 0 ? (
                      <tr><td colSpan="6" className="text-center text-muted">Sin ciudadanos registrados en el listado actual</td></tr>
                    ) : personas.map((p) => (
                      <tr key={p.id_personas}>
                        <td>#{p.id_personas}</td>
                        <td><strong>{p.cedula}</strong></td>
                        <td>{p.nombres} {p.apellidos}</td>
                        <td>{p.correo || '-'}</td>
                        <td>{p.telefono || '-'}</td>
                        <td className="d-flex gap-2 flex-wrap">
                          <button type="button" className="btn-estilo-actualizar sm" onClick={() => setEditPersona({ ...p, fecha_nacimiento: p.fecha_nacimiento ? String(p.fecha_nacimiento).slice(0, 10) : '' })}>
                            <i className="fa-solid fa-pen me-1"></i>Editar
                          </button>
                          <button type="button" className="btn-estilo-actualizar sm" onClick={() => handleEliminarPersona(p.id_personas)}>
                            <i className="fa-solid fa-trash me-1"></i>Eliminar
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {tab === 'vacuna' && (
            <div className="card card-futurista p-4 p-md-5">
              <h4 className="fw-bold text-azul mb-4"><i className="fa-solid fa-vial me-2 text-info"></i>Registro de Dosis Inmunológica Aplicada</h4>
              <form onSubmit={handleRegistrarVacuna} className="mb-5">
                <div className="row g-3">
                  <div className="col-md-4"><label className="form-label">Cédula Paciente</label><input type="text" className="form-control" placeholder="V-28123456" value={cedulaVacuna} onChange={(e) => setCedulaVacuna(e.target.value)} required /></div>
                  <div className="col-md-4">
                    <label className="form-label">Vacuna Aplicada</label>
                    <select className="form-select" value={vacuna} onChange={(e) => setVacuna(e.target.value)}><option>BCG</option><option>Pentavalente</option><option>Polio</option><option>Fiebre Amarilla</option></select>
                  </div>
                  <div className="col-md-4"><label className="form-label">Número de Lote</label><input type="text" className="form-control" placeholder="L-4471" value={lote} onChange={(e) => setLote(e.target.value)} required /></div>
                  <div className="col-md-4"><label className="form-label">Nro. de Dosis</label><input type="number" min="1" className="form-control" value={nroDosis} onChange={(e) => setNroDosis(e.target.value)} required /></div>
                  <div className="col-md-4"><label className="form-label">Fecha de Aplicación</label><input type="date" className="form-control" value={fechaAplicacion} onChange={(e) => setFechaAplicacion(e.target.value)} required /></div>
                  <div className="col-md-4"><label className="form-label">Centro Asistencial (ID o Nombre)</label><input type="text" className="form-control" value={centroSalud} onChange={(e) => setCentroSalud(e.target.value)} required /></div>
                  <div className="col-12 mt-3"><button type="submit" className="btn-estilo-actualizar">Registrar Dosis</button></div>
                </div>
              </form>

              <div className="table-responsive">
                <table className="table table-custom align-middle mb-0">
                  <thead>
                    <tr><th>ID</th><th>Cédula</th><th>Ciudadano</th><th>Vacuna</th><th>Dosis</th><th>Acciones</th></tr>
                  </thead>
                  <tbody>
                    {vacunas.length === 0 ? (
                      <tr><td colSpan="6" className="text-center text-muted">Sin dosis aplicadas registradas</td></tr>
                    ) : vacunas.map((v) => (
                      <tr key={v.id_registro}>
                        <td>#{v.id_registro}</td>
                        <td>{v.cedula}</td>
                        <td>{v.nombres} {v.apellidos}</td>
                        <td><strong>{v.nombre_vacuna || v.id_vacunas}</strong></td>
                        <td>#{v.nro_dosis}</td>
                        <td className="d-flex gap-2 flex-wrap">
                          <button type="button" className="btn-estilo-actualizar sm" onClick={() => setEditVacuna({ ...v })}>
                            <i className="fa-solid fa-pen me-1"></i>Editar
                          </button>
                          <button type="button" className="btn-estilo-actualizar sm" onClick={() => handleEliminarVacuna(v.id_registro)}>
                            <i className="fa-solid fa-trash me-1"></i>Eliminar
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {tab === 'examenes' && (
            <div className="card card-futurista p-4 p-md-5">
              <h4 className="fw-bold text-azul mb-4"><i className="fa-solid fa-paperclip me-2 text-info"></i>Anexo de Exámenes para la Subregión</h4>
              <form onSubmit={handleAnexarExamen} className="mb-5">
                <div className="row g-3">
                  <div className="col-md-6"><label className="form-label">Cédula Paciente</label><input type="text" className="form-control" value={cedulaExamen} onChange={(e) => setCedulaExamen(e.target.value)} required /></div>
                  <div className="col-md-6">
                    <label className="form-label">Tipo de Examen</label>
                    <select className="form-select" value={tipoExamen} onChange={(e) => setTipoExamen(e.target.value)}><option>Serología de Anticuerpos</option><option>Informe de Exención Médica</option></select>
                  </div>
                  <div className="col-md-6"><label className="form-label">Adjuntar Documento Digital (PDF/JPG)</label><input type="file" className="form-control" onChange={(e) => setArchivoNombre(e.target.files?.[0]?.name || '')} required /></div>
                  <div className="col-md-6"><label className="form-label">Ruta o Referencia de Soporte</label><input type="text" className="form-control" placeholder="Ej. /uploads/serologia.pdf" value={rutaArchivo} onChange={(e) => setRutaArchivo(e.target.value)} /></div>
                  <div className="col-12"><label className="form-label">Observación</label><input type="text" className="form-control" placeholder="Observación clínica opcional" value={observacion} onChange={(e) => setObservacion(e.target.value)} /></div>
                  <div className="col-12 mt-3"><button type="submit" className="btn-estilo-actualizar">Cargar Documento para Subregión</button></div>
                </div>
              </form>

              <div className="table-responsive">
                <table className="table table-custom align-middle mb-0">
                  <thead>
                    <tr><th>ID</th><th>Ciudadano</th><th>Archivo</th><th>Ruta</th><th>Acciones</th></tr>
                  </thead>
                  <tbody>
                    {examenes.length === 0 ? (
                      <tr><td colSpan="5" className="text-center text-muted">Sin exámenes anexados</td></tr>
                    ) : examenes.map((ex) => (
                      <tr key={ex.id_examenes}>
                        <td>#{ex.id_examenes}</td>
                        <td>{ex.nombres} {ex.apellidos} ({ex.cedula})</td>
                        <td>{ex.nombre_archivo}</td>
                        <td>{ex.ruta_archivo}</td>
                        <td className="d-flex gap-2 flex-wrap">
                          <button type="button" className="btn-estilo-actualizar sm" onClick={() => setEditExamen({ ...ex })}>
                            <i className="fa-solid fa-pen me-1"></i>Editar
                          </button>
                          <button type="button" className="btn-estilo-actualizar sm" onClick={() => handleEliminarExamen(ex.id_examenes)}>
                            <i className="fa-solid fa-trash me-1"></i>Eliminar
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {editPersona && (
            <div className="gov-modal-backdrop">
              <div className="gov-modal-card">
                <h5 className="fw-bold text-azul mb-3">Editar Ciudadano #{editPersona.id_personas}</h5>
                <form onSubmit={handleGuardarEditPersona} className="row g-3">
                  <div className="col-md-6"><label className="form-label">Cédula</label><input className="form-control" value={editPersona.cedula} onChange={(e) => setEditPersona({ ...editPersona, cedula: e.target.value })} required /></div>
                  <div className="col-md-6"><label className="form-label">Fecha Nacimiento</label><input type="date" className="form-control" value={editPersona.fecha_nacimiento} onChange={(e) => setEditPersona({ ...editPersona, fecha_nacimiento: e.target.value })} required /></div>
                  <div className="col-md-6"><label className="form-label">Nombres</label><input className="form-control" value={editPersona.nombres} onChange={(e) => setEditPersona({ ...editPersona, nombres: e.target.value })} required /></div>
                  <div className="col-md-6"><label className="form-label">Apellidos</label><input className="form-control" value={editPersona.apellidos} onChange={(e) => setEditPersona({ ...editPersona, apellidos: e.target.value })} required /></div>
                  <div className="col-md-6"><label className="form-label">Correo</label><input type="email" className="form-control" value={editPersona.correo || ''} onChange={(e) => setEditPersona({ ...editPersona, correo: e.target.value })} /></div>
                  <div className="col-md-6"><label className="form-label">Teléfono</label><input className="form-control" value={editPersona.telefono || ''} onChange={(e) => setEditPersona({ ...editPersona, telefono: e.target.value })} /></div>
                  <div className="col-12 d-flex justify-content-end gap-2 mt-3">
                    <button type="button" className="btn-estilo-actualizar sm" onClick={() => setEditPersona(null)}>Cancelar</button>
                    <button type="submit" className="btn-estilo-actualizar sm">Guardar Cambios</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {editVacuna && (
            <div className="gov-modal-backdrop">
              <div className="gov-modal-card">
                <h5 className="fw-bold text-azul mb-3">Editar Dosis #{editVacuna.id_registro}</h5>
                <form onSubmit={handleGuardarEditVacuna} className="row g-3">
                  <div className="col-md-6"><label className="form-label">Vacuna</label><input className="form-control" value={editVacuna.nombre_vacuna || editVacuna.id_vacunas || ''} onChange={(e) => setEditVacuna({ ...editVacuna, nombre_vacuna: e.target.value })} required /></div>
                  <div className="col-md-6"><label className="form-label">Lote / ID Lote</label><input className="form-control" value={editVacuna.numero_lote || editVacuna.id_lote || ''} onChange={(e) => setEditVacuna({ ...editVacuna, numero_lote: e.target.value })} required /></div>
                  <div className="col-md-6"><label className="form-label">Nro. Dosis</label><input type="number" min="1" className="form-control" value={editVacuna.nro_dosis || 1} onChange={(e) => setEditVacuna({ ...editVacuna, nro_dosis: e.target.value })} required /></div>
                  <div className="col-12 d-flex justify-content-end gap-2 mt-3">
                    <button type="button" className="btn-estilo-actualizar sm" onClick={() => setEditVacuna(null)}>Cancelar</button>
                    <button type="submit" className="btn-estilo-actualizar sm">Guardar Cambios</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {editExamen && (
            <div className="gov-modal-backdrop">
              <div className="gov-modal-card">
                <h5 className="fw-bold text-azul mb-3">Editar Examen #{editExamen.id_examenes}</h5>
                <form onSubmit={handleGuardarEditExamen} className="row g-3">
                  <div className="col-md-6"><label className="form-label">Nombre Archivo</label><input className="form-control" value={editExamen.nombre_archivo || ''} onChange={(e) => setEditExamen({ ...editExamen, nombre_archivo: e.target.value })} required /></div>
                  <div className="col-md-6"><label className="form-label">Ruta Archivo</label><input className="form-control" value={editExamen.ruta_archivo || ''} onChange={(e) => setEditExamen({ ...editExamen, ruta_archivo: e.target.value })} required /></div>
                  <div className="col-12 d-flex justify-content-end gap-2 mt-3">
                    <button type="button" className="btn-estilo-actualizar sm" onClick={() => setEditExamen(null)}>Cancelar</button>
                    <button type="submit" className="btn-estilo-actualizar sm">Guardar Cambios</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root-centro')).render(<CentroApp />);
  </script>
</body>
</html>
